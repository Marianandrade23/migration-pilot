[project]
name = "migration-pilot"
version = "0.1.0"
description = "An AI agent that moves data between business systems, checks that nothing gets lost, and improves every time a human corrects it."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
